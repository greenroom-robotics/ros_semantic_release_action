name: ROS Semantic Release

on:
  workflow_call:
    inputs:
      package:
        description: 'Package to release (empty = all)'
        type: string
        default: ''
      package_dir:
        description: 'Directory containing packages'
        type: string
        default: './'
      # Boolean distro inputs
      build_kilted:
        description: 'Build for Kilted'
        type: boolean
        default: true
      build_jazzy:
        description: 'Build for Jazzy'
        type: boolean
        default: false
      build_iron:
        description: 'Build for Iron'
        type: boolean
        default: false
      # Architecture options
      build_amd64:
        description: 'Build for amd64'
        type: boolean
        default: true
      build_arm64:
        description: 'Build for arm64'
        type: boolean
        default: true
      # Other options
      public:
        description: 'Publish as public packages'
        type: boolean
        default: false
      changelog:
        description: 'Generate changelog'
        type: boolean
        default: false
      skip_tag:
        description: 'Skip creating the git tag and GitHub release (use when another workflow owns tagging, e.g. the pixi release)'
        type: boolean
        default: false
      gpu:
        description: 'Enable GPU support'
        type: boolean
        default: false
      runner_amd64:
        description: 'Runner for amd64 builds'
        type: string
        default: 'runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=150gb'
      runner_arm64:
        description: 'Runner for arm64 builds'
        type: string
        default: 'runs-on=${{ github.run_id }}/runner=4cpu-linux-arm64/volume=150gb'
      runner_release:
        description: 'Runner for release job'
        type: string
        default: '2vcpu-ubuntu-2404'
      release_branches:
        description: 'Branches to release from (comma separated)'
        type: string
        default: 'main,master,alpha'
      ignore_packages:
        description: 'Packages to ignore (comma-separated). Use "pkg" for all distros or "distro:pkg" for specific distro'
        type: string
        default: ''
      lfs_include:
        description: 'Glob of LFS files to fetch on the build checkout (gitignore-style, comma-separated). Empty = no LFS fetch.'
        type: string
        default: ''
      cli_branch:
        description: 'Branch of platform_cli to install (for testing unreleased release-tooling changes).'
        type: string
        default: 'main'
    secrets:
      token:
        required: true
      # JSON object of BuildKit secret id -> file contents, for repos whose own
      # Dockerfile mounts secrets with --mount=type=secret. A secret rather than
      # an input because the values are secret; only the file paths reach the
      # build command.
      docker_secrets:
        required: false
      # Optional: provide a GitHub App's credentials to push the release
      # commit/tag and create the release AS the App (its identity and
      # permissions) instead of with the PAT + semantic-release-bot. When
      # omitted, falls back to `token` and the default identity.
      gh_app_client_id:
        required: false
      gh_app_private_key:
        required: false

jobs:
  setup:
    runs-on: runs-on=${{ github.run_id }}/runner=1cpu-linux-x64
    outputs:
      distros: ${{ steps.set-matrix.outputs.distros }}
      architectures: ${{ steps.set-matrix.outputs.architectures }}
    steps:
      - id: set-matrix
        run: |
          # Build distros array from boolean inputs
          distros=()
          [ "${{ inputs.build_iron }}" == "true" ] && distros+=("iron")
          [ "${{ inputs.build_jazzy }}" == "true" ] && distros+=("jazzy")
          [ "${{ inputs.build_kilted }}" == "true" ] && distros+=("kilted")

          if [ ${#distros[@]} -eq 0 ]; then
            echo "::error::No distros selected"
            exit 1
          fi

          # Build architectures array
          archs=()
          [ "${{ inputs.build_amd64 }}" == "true" ] && archs+=("amd64")
          [ "${{ inputs.build_arm64 }}" == "true" ] && archs+=("arm64")

          if [ ${#archs[@]} -eq 0 ]; then
            echo "::error::No architectures selected"
            exit 1
          fi

          echo "distros=$(jq -cn '$ARGS.positional' --args "${distros[@]}")" >> $GITHUB_OUTPUT
          echo "architectures=$(jq -cn '$ARGS.positional' --args "${archs[@]}")" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: true
      matrix:
        distro: ${{ fromJson(needs.setup.outputs.distros) }}
        arch: ${{ fromJson(needs.setup.outputs.architectures) }}

    name: Build - ${{ matrix.arch }} - ${{ matrix.distro }}
    runs-on: ${{ matrix.arch == 'arm64' && inputs.runner_arm64 || inputs.runner_amd64 }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: true
          token: ${{ secrets.token }}

      - name: Fetch LFS files
        if: inputs.lfs_include != ''
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="${{ inputs.lfs_include }}"

      - name: Create COLCON_IGNORE for excluded packages
        if: inputs.ignore_packages != ''
        shell: bash
        run: |
          DISTRO="${{ matrix.distro }}"
          IFS=',' read -ra ENTRIES <<< "${{ inputs.ignore_packages }}"
          for entry in "${ENTRIES[@]}"; do
            entry=$(echo "$entry" | xargs)
            [ -z "$entry" ] && continue

            # Check for distro:package format
            if [[ "$entry" == *:* ]]; then
              target_distro=$(echo "${entry%%:*}" | xargs)
              pkg=$(echo "${entry#*:}" | xargs)
              # Skip if not for this distro
              [ "$target_distro" != "$DISTRO" ] && continue
            else
              pkg="$entry"
            fi

            pkg_path="${{ inputs.package_dir }}/${pkg}"
            if [ -d "$pkg_path" ]; then
              touch "${pkg_path}/COLCON_IGNORE"
              echo "Created COLCON_IGNORE in ${pkg_path}"
            else
              echo "Warning: Package directory not found: ${pkg_path}"
            fi
          done

      - name: Build
        uses: Greenroom-Robotics/ros_semantic_release_action@main
        with:
          token: ${{ secrets.token }}
          package_dir: ${{ inputs.package_dir }}
          package: ${{ inputs.package }}
          arch: ${{ matrix.arch }}
          ros_distro: ${{ matrix.distro }}
          docker_secrets: ${{ secrets.docker_secrets }}
          github_release: false
          public: ${{ inputs.public }}
          changelog: false
          skip_build: false
          skip_tag: true
          gpu: ${{ inputs.gpu }}
          release_branches: ${{ inputs.release_branches }}
          cli_branch: ${{ inputs.cli_branch }}

  release:
    name: Create Release
    runs-on: ${{ inputs.runner_release }}
    needs: build
    # `secrets` isn't allowed in `if`, so surface "were App creds provided?" as
    # an env flag the steps below can branch on.
    env:
      HAS_APP_CREDS: ${{ secrets.gh_app_client_id != '' && secrets.gh_app_private_key != '' }}

    steps:
      # Mint an installation token so the release commit/tag is pushed and the
      # GitHub release created AS the App (its permissions), not the PAT.
      - name: Mint App token
        id: app-token
        if: ${{ env.HAS_APP_CREDS == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.gh_app_client_id }}
          private-key: ${{ secrets.gh_app_private_key }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # checkout stores this token in the git remote; @semantic-release/git
          # pushes the release commit + tag with it. App token when available,
          # else the PAT (previous behaviour).
          token: ${{ steps.app-token.outputs.token || secrets.token }}

      - name: Release
        uses: Greenroom-Robotics/ros_semantic_release_action@main
        with:
          token: ${{ steps.app-token.outputs.token || secrets.token }}
          # bot_slug defaults to the greenroom App bot in the action, so the
          # release commit is attributed to it by default. App creds (above)
          # additionally give the push the App's permissions; without them the
          # commit is still labelled the bot but pushed with the PAT.
          package_dir: ${{ inputs.package_dir }}
          package: ${{ inputs.package }}
          github_release: ${{ !inputs.skip_tag }}
          public: ${{ inputs.public }}
          changelog: ${{ inputs.changelog }}
          skip_build: true
          skip_tag: ${{ inputs.skip_tag }}
          release_branches: ${{ inputs.release_branches }}
          cli_branch: ${{ inputs.cli_branch }}
