name: Deb + Pixi Release (transition)

# Reusable "transition stage" release workflow: encapsulates the deb-release +
# pixi-recipes-PR pattern that repos like platform_toolbox currently hand-roll
# in their own release.yml (deb job -> pixi job, deb owns tagging). Also adds
# a `pixi-verify` job that proves the pixi build path works, in parallel with
# the deb build, before the recipes-pr job opens a PR against the tag deb
# creates.
#
# Callers keep their own workflow_dispatch inputs (package dropdown, distro
# flags) and forward them here via `uses: ./.github/workflows/deb-pixi-release.yml`
# with `with:`/`secrets:`.

on:
  workflow_call:
    inputs:
      package:
        description: 'Package to release (empty = all)'
        type: string
        default: ''
      package_dir:
        description: 'Directory containing packages'
        type: string
        default: './'
      build_kilted:
        description: 'Build for Kilted'
        type: boolean
        default: true
      build_jazzy:
        description: 'Build for Jazzy'
        type: boolean
        default: false
      build_iron:
        description: 'Build for Iron'
        type: boolean
        default: false
      build_amd64:
        description: 'Build debs for amd64'
        type: boolean
        default: true
      build_arm64:
        description: 'Build debs for arm64'
        type: boolean
        default: true
      runner_amd64:
        description: 'Runner override for amd64 deb builds (empty = release.yml default)'
        type: string
        default: 'runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=150gb'
      runner_arm64:
        description: 'Runner override for arm64 deb builds (empty = release.yml default)'
        type: string
        default: 'runs-on=${{ github.run_id }}/runner=4cpu-linux-arm64/volume=150gb'
      changelog:
        description: 'Generate changelog'
        type: boolean
        default: false
      ros_distro:
        description: 'ROS distro identifier for the conda recipe (the pixi recipe path is kilted-native regardless of which distros are built as debs).'
        type: string
        default: 'kilted'
      runner_pixi:
        description: 'Runner for the pixi-verify job (builds a conda package, so bigger than a plain checkout runner).'
        type: string
        default: 'runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=150gb'
      lfs_include:
        description: 'Glob of LFS files to fetch on the build/pixi-verify checkouts (gitignore-style, comma-separated). Empty = no LFS fetch.'
        type: string
        default: ''
      lfs_ignore_config_exclude:
        description: 'Ignore the repo .lfsconfig `fetchexclude` on the pixi-verify checkout, making `lfs_include` authoritative. ONLY for repos whose fetchexclude is a blanket `*` (set to stop local auto-fetch). Leave false where fetchexclude names specific paths — overriding it there re-downloads exactly the artefacts it exists to skip.'
        type: boolean
        default: false
      submodules:
        description: 'Init the repo''s git submodules (recursively) on the pixi-verify checkout, authenticated with the GH App token so private org submodules work regardless of the URL form in .gitmodules. The deb job already checks out submodules via release.yml.'
        type: boolean
        default: false
      lfs_packages:
        description: 'Newline- or comma-separated package names whose ros-recipes entry gets `lfs: true`, so the pixi-native buildfarm pulls their LFS objects too. Forwarded to mise recipes-pr. Authoritative per release: a released package not listed here has any existing `lfs: true` removed.'
        type: string
        default: ''
    secrets:
      token:
        description: 'Forwarded to the deb release.yml (github_release + git push).'
        required: true
      docker_secrets:
        description: 'JSON object of BuildKit secret id -> file contents, for repos whose own Dockerfile mounts secrets with --mount=type=secret. Forwarded to the deb release.yml.'
        required: false
      gh-app-client-id:
        description: 'GitHub App client id used to mint a token for private deps, the pixi build, and the recipes PR.'
        required: true
      gh-app-private-key:
        description: 'GitHub App private key (PEM) corresponding to gh-app-client-id.'
        required: true
      azure-client-id:
        description: 'AZURE_CLIENT_ID — federated identity bound to the calling repo.'
        required: true
      azure-tenant-id:
        description: 'AZURE_TENANT_ID for the channel storage account.'
        required: true
      azure-subscription-id:
        description: 'AZURE_SUBSCRIPTION_ID for the channel storage account.'
        required: true

jobs:
  # Deb release: builds debs per arch/distro, owns tagging (skip_tag: false),
  # cuts the GitHub release. Same reusable workflow platform_toolbox etc. call
  # directly today.
  deb:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      package: ${{ inputs.package }}
      package_dir: ${{ inputs.package_dir }}
      build_kilted: ${{ inputs.build_kilted }}
      build_jazzy: ${{ inputs.build_jazzy }}
      build_iron: ${{ inputs.build_iron }}
      build_amd64: ${{ inputs.build_amd64 }}
      build_arm64: ${{ inputs.build_arm64 }}
      runner_amd64: ${{ inputs.runner_amd64 }}
      runner_arm64: ${{ inputs.runner_arm64 }}
      changelog: ${{ inputs.changelog }}
      skip_tag: false
      lfs_include: ${{ inputs.lfs_include }}
    secrets:
      token: ${{ secrets.token }}
      docker_secrets: ${{ secrets.docker_secrets }}

  # Runs in parallel with `deb`. Proves the pixi build path works before the
  # recipes-pr job below opens a PR against the tag `deb` creates - a broken
  # pixi build fails loudly here instead of surfacing later as a failed recipe
  # build in ros-recipes.
  pixi-verify:
    runs-on: ${{ inputs.runner_pixi }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # checkout's own `submodules:` input authenticates with GITHUB_TOKEN,
      # which is scoped to the calling repo — a private org submodule 404s.
      # Mint the GH App installation token (org-wide) and fetch them ourselves.
      - name: Generate GitHub App token
        if: inputs.submodules
        id: submodule-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.gh-app-client-id }}
          private-key: ${{ secrets.gh-app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Fetch submodules
        if: inputs.submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.submodule-token.outputs.token }}
        run: |
          set -euo pipefail
          # Map both remote forms straight to the token URL — git applies
          # insteadOf once (no chaining), so ssh→https would miss a second rule.
          # Must be --global: `submodule update` clones in fresh directories
          # that never read the parent repo's local config.
          key="url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf"
          git config --global "$key" "https://github.com/"
          git config --global --add "$key" "git@github.com:"
          git submodule update --init --recursive --depth=1
          git config --global --unset-all "$key"

      # The deb job pulls LFS inside release.yml; pixi-verify checks out
      # separately, so it needs its own pull for `lfs_include` to mean what its
      # description says. Same glob, same `empty = no fetch` contract.
      - name: Fetch LFS files
        if: inputs.lfs_include != ''
        shell: bash
        env:
          INCLUDE: ${{ inputs.lfs_include }}
          IGNORE_CONFIG_EXCLUDE: ${{ inputs.lfs_ignore_config_exclude }}
        run: |
          set -euo pipefail
          git lfs install --local
          # git-lfs overrides fetchinclude and fetchexclude INDEPENDENTLY: with
          # only --include, a configured `fetchexclude = *` still wins and
          # nothing is fetched. --exclude="" fixes that but also discards a
          # TARGETED fetchexclude, which is a deliberate cost control. Opt-in.
          if [ "$IGNORE_CONFIG_EXCLUDE" = "true" ]; then
            git lfs pull --include="$INCLUDE" --exclude=""
          else
            git lfs pull --include="$INCLUDE"
          fi

      - uses: greenroom-robotics/mise/.github/actions/setup@v8
        id: setup
        with:
          gh-app-client-id: ${{ secrets.gh-app-client-id }}
          gh-app-private-key: ${{ secrets.gh-app-private-key }}
          azure-client-id: ${{ secrets.azure-client-id }}
          azure-tenant-id: ${{ secrets.azure-tenant-id }}
          azure-subscription-id: ${{ secrets.azure-subscription-id }}

      - name: Run mise ci build
        shell: bash
        run: |
          args=(--package-dir "${{ inputs.package_dir }}")
          if [ -n "${{ inputs.package }}" ]; then
            args+=(--package "${{ inputs.package }}")
          fi
          pixi run --manifest-path "$MISE_MANIFEST" mise ci build "${args[@]}"

  # Mirrors platform_toolbox's pixi job: opens/updates the conda recipe PR
  # against the tag `deb` just created, once both the deb release and the
  # pixi build have been verified.
  recipes-pr:
    needs: [deb, pixi-verify]
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: greenroom-robotics/mise/.github/actions/recipes-pr@v8
        with:
          dispatch-sha: ${{ github.sha }}
          package: ${{ inputs.package }}
          package-dir: ${{ inputs.package_dir }}
          ros-distro: ${{ inputs.ros_distro }}
          lfs-packages: ${{ inputs.lfs_packages }}
          gh-app-client-id: ${{ secrets.gh-app-client-id }}
          gh-app-private-key: ${{ secrets.gh-app-private-key }}
          azure-client-id: ${{ secrets.azure-client-id }}
          azure-tenant-id: ${{ secrets.azure-tenant-id }}
          azure-subscription-id: ${{ secrets.azure-subscription-id }}
