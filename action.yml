name: "ROS Semantic Release Action"
description: "Uses semantic release to build and release ros packages as debians"
author: "Greenroom Robotics"
branding:
  icon: "package"
  color: "gray-dark"
inputs:
  token:
    description: "The Github token with access to the packages repo and release api"
    required: true
  changelog:
    description: "Should we generate and commit back a changelog?"
    default: "true"
  github_release:
    description: "Should we create a github release?"
    default: "true"
  skip_tag:
    description: "Should we skip creating a git tag?"
    default: "false"
  skip_build:
    description: "Should we skip building the packages?"
    default: "false"
  public:
    description: "Should the packages be public?"
    default: "false"
  package:
    description: "The package to release. If not set, all packages in the 'package_dir' will be released."
    default: ""
  package_dir:
    description: "The directory to release packages from. If not set, the root of the repo will be used."
    default: "./"
  arch:
    description: "The architecture to build for (eg amd64 or arm64)."
    default: "amd64"
  gpu:
    description: "This will be passed into the Dockerfile as $GPU to enable GPU support."
    default: "false"
  ros_distro:
    description: "The version of ros2 to build for (eg galactic or humble). This will be passed into the Dockerfile as $ROS_DISTRO."
    default: "iron"
  release_branches:
    description: "The branches to release from. Comma separated list."
    default: "main,master,alpha"
  cli_branch:
    description: "The branch of platform_cli to use"
    default: "main"
  secrets:
    description: "JSON string of secrets to pass to docker build (e.g. '{\"API_TOKEN_GITHUB\": \"./.secrets/github_token\", \"apt_conf\": \"./.secrets/apt.conf\"}')"
    default: "{}"
  docker_secrets:
    description: "JSON string of BuildKit secret id -> file CONTENTS, written to files here and mounted under those ids (e.g. '{\"API_TOKEN_GITHUB\": \"ghp_...\", \"apt_conf\": \"machine ...\\nlogin ...\\n\"}'). Use in place of `secrets` when the caller has the values but no file to point at."
    default: ""
  bot_slug:
    description: "GitHub App slug to attribute the release commit to. Defaults to the greenroom App bot; set empty to fall back to semantic-release's default identity."
    default: "greenroom-gremlin"

runs:
  using: "composite"
  steps:
    - name: Collect Workflow Telemetry
      uses: Greenroom-Robotics/workflow-telemetry-action@main

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup Poetry
      shell: bash
      run: |
        echo "::group::Install Poetry"
        pip install poetry==2.4.2 poetry-plugin-export
        echo "::endgroup::"

    - name: Install platform_cli
      shell: bash
      run: |
        echo "::group::Install platform_cli"
        pip install git+https://github.com/Greenroom-Robotics/platform_cli.git@${{ inputs.cli_branch }}
        echo "::endgroup::"

    - name: Setup Release Environment
      shell: bash
      run: |
        echo "::group::Setup Release Environment"
        platform release setup \
        --package=${{ inputs.package }} \
        --package-dir=${{ inputs.package_dir }}
        echo "::endgroup::"

    - name: Write docker build secrets
      id: docker-secrets
      shell: bash
      env:
        DOCKER_SECRETS: ${{ inputs.docker_secrets }}
        SECRETS: ${{ inputs.secrets }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/write_docker_secrets.py"

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      if: ${{ inputs.skip_build == 'true' }}
      with:
        pattern: build-*
        path: ${{ inputs.package_dir }}
        merge-multiple: true

    # Attribute the release commit to the App bot instead of semantic-release-bot.
    # Only the release job (skip_build) commits; build legs never push. The
    # numeric user id in the noreply email links the commit to the App account
    # so GitHub renders its avatar. semantic-release reads these GIT_* env vars.
    - name: Configure git identity as App bot
      if: ${{ inputs.skip_build == 'true' && inputs.bot_slug != '' }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        SLUG: ${{ inputs.bot_slug }}
      shell: bash
      run: |
        set -euo pipefail
        user_id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
        {
          echo "GIT_AUTHOR_NAME=${SLUG}[bot]"
          echo "GIT_AUTHOR_EMAIL=${user_id}+${SLUG}[bot]@users.noreply.github.com"
          echo "GIT_COMMITTER_NAME=${SLUG}[bot]"
          echo "GIT_COMMITTER_EMAIL=${user_id}+${SLUG}[bot]@users.noreply.github.com"
        } >> "$GITHUB_ENV"

    - name: Create Release
      env:
        API_TOKEN_GITHUB: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_USER: ${{ github.actor }}
        GPU: ${{ inputs.gpu }}
      shell: bash
      run: |
        platform release create \
        --changelog=${{ inputs.changelog }} \
        --public=${{ inputs.public }} \
        --package=${{ inputs.package }} \
        --package-dir=${{ inputs.package_dir }} \
        --arch=${{ inputs.arch }} \
        --ros-distro=${{ inputs.ros_distro }} \
        --github-release=${{ inputs.github_release }} \
        --skip-tag=${{ inputs.skip_tag }} \
        --skip-build=${{ inputs.skip_build }} \
        --branches=${{ inputs.release_branches }} \
        --secrets='${{ steps.docker-secrets.outputs.secrets_json }}'

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ inputs.skip_build == 'false' }}
      with:
        name: build-${{ inputs.arch }}-${{ inputs.ros_distro }}
        path: |
          ${{ inputs.package_dir }}/debs/*.deb
          ${{ inputs.package_dir }}/debs/*.ddeb
          ${{ inputs.package_dir }}/*/debs/*.deb
          ${{ inputs.package_dir }}/*/debs/*.ddeb
        compression-level: 0 # no compression
